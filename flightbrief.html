<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f4f8; --surface: #ffffff; --border: #d1d9e0;
  --text: #1a2332; --muted: #64748b; --subtle: #94a3b8;
  --amber: #d97706; --amber-dark: #b45309; --amber-light: rgba(217,119,6,0.1);

  --shadow: 0 2px 12px rgba(15,34,64,0.08);
}
html, body { height: 100%; font-family: var(--font-body); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body { min-height: 100vh; background: linear-gradient(150deg, #dde8f5 0%, #f0f4f8 50%, #e8eef7 100%); }
.app { max-width: 720px; margin: 0 auto; padding: 0 0 6rem; }
.app-header { text-align: center; padding: 1.75rem 1.25rem 0; }
.header-eyebrow { font-family: var(--font-display); font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--subtle); margin-bottom: 0.35rem; }

.sync-pill { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.6rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 0.25rem 0.75rem; font-family: var(--font-display); font-size: 0.52rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--subtle); transition: background 0.3s; }

.btn-sm-morning { border-color: rgba(217,119,6,0.35); color: var(--amber); }

.brief-stamp.morning { color: var(--amber); }

.brief-section.evening { color: var(--indigo); }

.cl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.cl-title { font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--green); }
.cl-progress { font-family: var(--font-display); font-size: 0.58rem; letter-spacing: 0.1em; color: var(--muted); }
.cl-items { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
.cl-item { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.55rem 0.7rem; border-radius: 7px; border: 1px solid transparent; background: rgba(248,250,252,0.9); transition: all 0.15s; }
.cl-item.done { background: var(--green-light); border-color: rgba(5,150,105,0.2); }
.cl-check { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: all 0.15s; background: #fff; }

.tag-HIGH { background: rgba(220,38,38,0.1); color: var(--red); }

.tag-LOW { background: rgba(71,85,105,0.1); color: var(--slate); }

.cl-push { width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; cursor: pointer; font-size: 0.65rem; color: var(--subtle); transition: all 0.15s; }

.add-row { display: flex; gap: 0.45rem; }

.pushed-wrap { margin-bottom: 1rem; }
.pushed-card { background: var(--surface); border-radius: var(--radius); border: 1px solid rgba(220,38,38,0.18); box-shadow: 0 2px 12px rgba(220,38,38,0.05); }
.pushed-hdr { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1.1rem; border-bottom: 1px solid rgba(220,38,38,0.1); }
.pushed-title { font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); }

.pushed-item:hover { background: rgba(220,38,38,0.12); }
.pushed-circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(220,38,38,0.3); flex-shrink: 0; margin-top: 2px; background: #fff; }
.pushed-content { flex: 1; }
.pushed-text { font-size: 0.86rem; color: #334155; line-height: 1.45; }
.pushed-meta { display: flex; gap: 0.45rem; align-items: center; margin-top: 0.3rem; flex-wrap: wrap; }
.day-badge { font-family: var(--font-display); font-size: 0.5rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.12rem 0.45rem; border-radius: 8px; background: var(--red); color: #fff; font-weight: 700; }
.pushed-reason { font-size: 0.72rem; color: var(--muted); font-style: italic; }
.modal-overlay { position: fixed; inset: 0; background: rgba(10,20,40,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1.5rem; }
.modal-box { background: #fff; border-radius: 14px; padding: 1.75rem; max-width: 360px; width: 100%; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
.modal-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
.modal-task { font-size: 0.83rem; color: var(--muted); background: var(--bg); border-radius: 7px; padding: 0.55rem 0.8rem; margin-bottom: 1rem; line-height: 1.5; }
.modal-input { width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 7px; font-family: var(--font-body); font-size: 0.86rem; outline: none; margin-bottom: 1rem; -webkit-appearance: none; color: var(--text); }
.modal-btns { display: flex; gap: 0.5rem; }
.modal-btn { flex: 1; padding: 0.65rem; border-radius: 7px; font-family: var(--font-display); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; font-weight: 600; border: none; }
.modal-cancel { background: var(--bg); color: var(--muted); }
.modal-confirm { background: var(--amber); color: #fff; }
.loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.85rem; padding: 2.5rem 0; }
.spinner { width: 34px; height: 34px; border: 2.5px solid var(--border); border-radius: 50%; border-top-color: var(--amber); animation: spin 0.8s linear infinite; }
.spinner.eve { border-top-color: var(--indigo); }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.error-box { background: #fff; border: 1px solid rgba(220,38,38,0.25); border-radius: var(--radius); padding: 1.25rem; text-align: center; margin-bottom: 1rem; }
.error-title { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); margin-bottom: 0.4rem; }
.error-msg { font-size: 0.83rem; color: var(--muted); line-height: 1.55; margin-bottom: 0.85rem; }
.playbook-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.85rem; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); margin-bottom: 0.5rem; }
.playbook-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }

// ── SYSTEM PROMPT ──────────────────────────────────────────────────────

- Business development: non-negotiable daily block — flag if missing or rolling
- Intentional downtime is a scheduled mission item
- Home projects: sequential, one 100% complete before starting next
- Flag business items rolling 2+ days — call it out directly

## CHECKLIST — MANDATORY
CRITICAL: Every brief MUST end with a CHECKLIST section. NEVER skip it. NEVER substitute narrative text.

Format EXACTLY:
CHECKLIST:
[HIGH] Task here
[MED] Task here
[LOW] Task here

Rules: 5-10 items. ONLY HIGH/MED/LOW. Pull from priority stack. CHECKLIST: on its own line. Nothing after checklist items.

## FORMAT
MORNING: Mission objective → Priority stack → Conflicts → Business dev flag → Send-off → CHECKLIST
EVENING: Debrief → What rolled/why → Tomorrow preview → 2+ day rollovers called out → Wheels-down → CHECKLIST
Tone: Military/aviation. BLUF. Emoji headers. Concise.`;

function initSupa() {
  const url = ls(K.SUPA_URL), anon = ls(K.SUPA_ANON);
  if (!url || !anon) return;
  try { supaClient = window.supabase.createClient(url, anon); setSync(true); } catch(e) { supaClient = null; }
}

function setSync(live) {
  document.getElementById('syncDot').className = 'sync-dot'+(live?' live':'');
  document.getElementById('syncLabel').textContent = live ? 'Synced' : 'Local Only';
}

function ls(k) { return localStorage.getItem(k); }
function lss(k,v) { localStorage.setItem(k,v); }
function lsr(k) { localStorage.removeItem(k); }

async function loadData() {
  if (supaClient) {
    try {
      const {data,error} = await supaClient.from('flightbrief_state').select('*').eq('device_id',DEVICE_ID).maybeSingle();
      if (!error && data) {
        checklistItems = data.checklist||[];
        pushedItems = data.pushed||[];
        projects = data.projects||defaultProjects();
        plays = data.plays||defaultPlays();
        return;
      }
    } catch(e) { console.error('Load failed',e); }
  }
  try { checklistItems = JSON.parse(ls(K.CL)||'[]'); } catch(e) { checklistItems=[]; }
  try { pushedItems = JSON.parse(ls(K.PUSHED)||'[]'); } catch(e) { pushedItems=[]; }
  try { projects = JSON.parse(ls(K.PROJECTS)||'null')||defaultProjects(); } catch(e) { projects=defaultProjects(); }
  try { plays = JSON.parse(ls(K.PLAYS)||'null')||defaultPlays(); } catch(e) { plays=defaultPlays(); }
}

async function saveData() {
  lss(K.CL,JSON.stringify(checklistItems));
  lss(K.PUSHED,JSON.stringify(pushedItems));
  lss(K.PROJECTS,JSON.stringify(projects));
  lss(K.PLAYS,JSON.stringify(plays));
  if (!supaClient) return;
  try {
    const {error} = await supaClient.from('flightbrief_state').upsert(
      {device_id:DEVICE_ID,checklist:checklistItems,pushed:pushedItems,projects:projects,plays:plays,updated_at:new Date().toISOString()},
      {onConflict:'device_id'}
    );
    if (error) console.error('Save error:',error.message);
  } catch(e) { console.error('Save failed',e); }
}

function renderBriefBody() {
  const el = document.getElementById('briefBody'); if (!el) return;
  const clean = stripCL(briefText);
  const rx = /^[🌅🌙✈️📋⚡🎯🔍📌🏁✅❌⚠️🛬🛫🗒️💡🔥👊☀️🚀🏒⛳🔧💼🚤🧠📊🏡]/u;
  el.innerHTML = clean.split('\n').map(l=>{
    if (!l.trim()) return '<div class="brief-gap"></div>';
    if (l.match(/^#{1,3}\s/)) return `<div class="brief-section ${briefMode}">${l.replace(/^#+\s*/,'')}</div>`;
    if (rx.test(l.trim())) return `<div class="brief-section ${briefMode}">${l}</div>`;
    return `<div class="brief-line">${l.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`;

}

function confirmPush() {

  const reason=document.getElementById('pushReason')?.value?.trim()||'';
  const ex=pushedItems.find(p=>p.text===pushModalItem.text);
  if (ex) { ex.pushCount++; if(reason) ex.reason=reason; }
  else pushedItems.push({id:Date.now()+Math.random(),text:pushModalItem.text,pushCount:1,reason});
  checklistItems=checklistItems.filter(i=>String(i.id)!==String(pushModalItem.id));

}

function setMode(m) { briefMode=m; briefGenerated=false; briefText=''; briefError=''; renderToday(); }
function resetBrief() { briefGenerated=false; briefText=''; briefError=''; renderToday(); }
function regenBrief() { briefGenerated=false; renderToday(); setTimeout(generateBrief,80); }

function parseCL(text) {
  const items=[]; let inCL=false;
  for (const line of text.split('\n')) {
    const t=line.trim();
    if (/^#{0,3}\s*\*{0,2}CHECKLIST:?\*{0,2}\s*$/i.test(t)) { inCL=true; continue; }
    if (inCL) {
      const m=t.match(/^\*{0,2}\[(HIGH|MED|LOW)\]\*{0,2}\s+(.+)$/i);
      if (m) items.push({id:Date.now()+Math.random(),text:m[2].replace(/\*\*/g,'').trim(),priority:m[1].toUpperCase(),done:false,added:false});
      else if (t==='') continue;
      else if (t.startsWith('#')||t.startsWith('---')) break;
    }
  }
  return items;
}

function stripCL(text) {
  const u=text.toUpperCase();
  for (const m of ['\nCHECKLIST:','\n## CHECKLIST','\n**CHECKLIST**','\n### CHECKLIST']) {
    const idx=u.indexOf(m.toUpperCase()); if (idx!==-1) return text.substring(0,idx).trim();
  }
  return text.split('\n').filter(l=>!/^\*{0,2}\[(HIGH|MED|LOW)\]/i.test(l.trim())).join('\n').trim();
}

async function generateBrief() {
  const cal=document.getElementById('fCal')?.value||'';
  const tasks=document.getElementById('fTasks')?.value||'';
  const done=document.getElementById('fDone')?.value||'';
  const notes=document.getElementById('fNotes')?.value||'';
  lastInputs={cal,tasks,done,notes};
  const pc=pushedItems.length>0?'\n\nPUSHED ITEMS:\n'+pushedItems.map(i=>`- ${i.text} (pushed ${i.pushCount}x${i.reason?', reason: '+i.reason:''})`).join('\n'):'';
  const prompt=briefMode==='morning'
    ?`Generate my MORNING BRIEF.\n\nCalendar/flights:\n${cal||'None'}\n\nTasks & priorities:\n${tasks||'None'}${pc}\n\nNotes:\n${notes||'None'}\n\nEnd with the CHECKLIST section.`
    :`Generate my EVENING SHUTDOWN BRIEF.\n\nAccomplished:\n${done||'Not specified'}\n\nDidn't get done:\n${tasks||'None'}${pc}\n\nTomorrow:\n${cal||'None'}\n\nNotes:\n${notes||'None'}\n\nEnd with the CHECKLIST section for tomorrow.`;
  briefLoading=true; briefError=''; briefGenerated=false;
  renderToday();
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ls(K.API),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2500,system:SYSTEM_PROMPT,messages:[{role:'user',content:prompt}]})
    });
    if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||`API error ${res.status}`); }
    const data=await res.json();
    if (data.error) throw new Error(data.error.message);
    briefText=data.content?.map(b=>b.text||'').join('')||'';
    if (!briefText) throw new Error('Empty response. Please try again.');
    if (briefMode==='evening') {
      checklistItems.filter(i=>!i.done).forEach(item=>{
        const ex=pushedItems.find(p=>p.text===item.text);
        if (ex) ex.pushCount++;
        else pushedItems.push({id:Date.now()+Math.random(),text:item.text,pushCount:1,reason:'Not completed at shutdown'});
      });
      checklistItems=[];
    }
    const parsed=parseCL(briefText);
    if (parsed.length>0) checklistItems=parsed;
    await saveData();
    briefLoading=false; briefGenerated=true; renderToday();
  } catch(e) {
    briefLoading=false;
    briefError=e.message.includes('invalid_api_key')||e.message.includes('authentication')?'Invalid API key. Use Reset / Update Credentials.':e.message.includes('rate_limit')?'Rate limit. Wait 30 seconds.':e.message.includes('overloaded')?'API busy. Wait a moment.':e.message+'. Check connection.';
    renderToday();
  }
}

        <div class="playbook-item"><div class="playbook-status status-pending"></div><div class="playbook-content"><div class="playbook-name">BucksCountyPARealEstate.net Rebuild</div><div class="playbook-note">Full site rebuild and relaunch under consideration.</div></div></div>
      </div>
    </div>`;
  renderPlays();
}

function renderPlays() {
  const el=document.getElementById('playsContainer'); if (!el) return;
  const sc={active:'var(--green)',pending:'var(--amber)',paused:'var(--subtle)'};
  el.innerHTML=plays.map(p=>`
    <div class="playbook-item">
      <div class="playbook-status" style="background:${sc[p.status]||'var(--subtle)'}"></div>
      <div class="playbook-content">
        <div class="playbook-name">${p.name}</div>
        <div style="display:flex;gap:0.4rem;margin:0.4rem 0;align-items:center;flex-wrap:wrap">
          <div class="playbook-tag">${p.tag}</div>
          <select class="play-select" onchange="updatePlayStatus(${p.id},this.value)">
            <option value="active" ${p.status==='active'?'selected':''}>Active</option>
            <option value="pending" ${p.status==='pending'?'selected':''}>Pending</option>
            <option value="paused" ${p.status==='paused'?'selected':''}>Paused</option>
          </select>
        </div>
        <textarea class="notes-textarea" placeholder="Play notes..." onblur="updatePlayNote(${p.id},this.value)">${p.note||''}</textarea>
      </div>
    </div>`).join('');
}

function updatePlayStatus(id,status) {
  const p=plays.find(x=>x.id===id); if(p){p.status=status;saveData();renderBusiness();}
}
function updatePlayNote(id,note) {
  const p=plays.find(x=>x.id===id); if(p&&note!==p.note){p.note=note;saveData();}
}
function addPlay() {
  const name=prompt('Play name:'); if (!name?.trim()) return;
  plays.push({id:Date.now(),name:name.trim(),status:'pending',note:'',tag:`Play ${plays.length+1}`});
  saveData(); renderBusiness();
}
function toggleCard(hdr) { hdr.closest('.card').classList.toggle('collapsed'); }

// ── LIFE OPS ───────────────────────────────────────────────────────────
function renderLife() {
  const el=document.getElementById('lifeMain'); if (!el) return;
  el.innerHTML=`
    <div class="section-label">Home Projects — One at a Time, 100% Before Next</div>
    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-header-left"><span style="font-size:1rem">🏠</span><span class="card-title">Project Queue</span></div>
        <div style="display:flex;gap:0.5rem;align-items:center">
          <span class="card-badge" style="background:var(--green-light);color:var(--green)">${projects.filter(p=>p.pct===100).length}/${projects.length} Done</span>
          <span class="card-chevron">▾</span>
        </div>
      </div>
      <div class="card-body">
        <div id="projContainer"></div>
        <div style="margin-top:0.75rem">
          <button class="btn btn-primary" style="padding:0.65rem" onclick="toggleAddProj()">+ Add Project</button>
          <div id="addProjForm" style="display:none;margin-top:0.75rem;background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:1rem">
            <div class="form-field"><label>Project Name</label><input type="text" id="newProjName" placeholder="Project name..." /></div>
            <div class="form-field"><label>Initial Notes</label><textarea id="newProjNotes" rows="2" placeholder="Context, notes..."></textarea></div>
            <div class="btn-row">
              <button class="btn-sm" onclick="toggleAddProj()">Cancel</button>
              <button class="btn-sm" style="background:var(--indigo);color:#fff;border-color:var(--indigo)" onclick="saveNewProj()">Add</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="section-label">Sea-Doos — Shore Season Prep</div>
    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-header-left"><span style="font-size:1rem">🚤</span><span class="card-title">Fleet Status</span></div>
        <span class="card-chevron">▾</span>
      </div>
      <div class="card-body">
        ${[{n:1,s:'Mission Ready',p:100,note:"Staged at Dad's. Good to go."},{n:2,s:'Nearly Ready',p:85,note:'Fuel pump installed. Fire-up test pending.'},{n:3,s:'In Progress',p:50,note:'Carbs rebuilt. Reinstall and test remaining.'},{n:4,s:'Queued Last',p:20,note:'New motor on bench. Last in sequence.'}].map(ski=>`
          <div class="project-item">
            <div class="project-header"><div class="project-name">Sea-Doo #${ski.n} — ${ski.s}</div><div class="project-pct">${ski.p}%</div></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${ski.p}%"></div></div>
            <div class="project-notes">${ski.note}</div>
          </div>`).join('')}
        <div style="background:var(--amber-light);border:1px solid rgba(217,119,6,0.2);border-radius:7px;padding:0.65rem 0.85rem;margin-top:0.5rem">
          <div style="font-family:var(--font-display);font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--amber)">Trailer Goal</div>
          <div style="font-size:0.83rem;color:var(--text);margin-top:0.2rem">Sell both single trailers → Buy second 2-place trailer</div>
        </div>
      </div>
    </div>
    <div class="section-label">Family</div>
    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-header-left"><span style="font-size:1rem">👨‍👩‍👧‍👦</span><span class="card-title">Family Ops</span></div>
        <span class="card-chevron">▾</span>
      </div>
      <div class="card-body">
        <div class="playbook-item"><div class="playbook-status status-active"></div><div class="playbook-content"><div class="playbook-name">Mom — Discharge from Pennsburg Manor</div><div class="playbook-note">Expected ~2 weeks. Coordinating home health and family. Red Hill, PA.</div><div class="playbook-tag">High Priority</div></div></div>
        <div class="playbook-item"><div class="playbook-status status-pending"></div><div class="playbook-content"><div class="playbook-name">Anniversary Trip — October</div><div class="playbook-note">Playa del Carmen booked. Vow renewal TBD — possibly small group or cancelled. Decision pending.</div><div class="playbook-tag">October</div></div></div>
      </div>
    </div>`;
  renderProjects();
}

function renderProjects() {
  const el=document.getElementById('projContainer'); if (!el) return;
  el.innerHTML=projects.map((p,i)=>`
    <div class="project-item">
      <div class="project-header"><div class="project-name">${i+1}. ${p.name}</div><div class="project-pct">${p.pct}%</div></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.pct}%"></div></div>
      <textarea class="notes-textarea" placeholder="Notes..." onblur="updateProjNotes(${p.id},this.value)">${p.notes||''}</textarea>
      <div class="project-controls">
        ${[0,25,50,75,100].map(pct=>`<button class="pct-btn ${p.pct===pct?'complete-btn':''}" onclick="setProjPct(${p.id},${pct})">${pct===100?'✓ Done':pct+'%'}</button>`).join('')}
      </div>
    </div>`).join('');
}

function setProjPct(id,pct) {
  const p=projects.find(x=>x.id===id); if(p){p.pct=pct;saveData();renderProjects();}
}
function updateProjNotes(id,notes) {
  const p=projects.find(x=>x.id===id); if(p&&notes!==p.notes){p.notes=notes;saveData();}
}
function toggleAddProj() {
  const f=document.getElementById('addProjForm'); if(f) f.style.display=f.style.display==='none'?'block':'none';
}
function saveNewProj() {
  const name=document.getElementById('newProjName')?.value?.trim();
  const notes=document.getElementById('newProjNotes')?.value?.trim();
  if (!name) { alert('Enter a project name.'); return; }
  projects.push({id:Date.now(),name,pct:0,notes:notes||''});
  saveData(); toggleAddProj(); renderProjects();
}

// ── START ──────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
